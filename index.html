<head>

  <meta name="description" content="Brain in a Jar VTuber • Gaming & Chaos!">

  <meta name="theme-color" content="#00CAC2"/>

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shoomimi 🧠⚡ | Lab Links">
  <meta property="og:description" content="Brain in a Jar VTuber • Gaming & Chaos!">
  <meta property="og:image" content="/shoomimi.png">
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="1200"/>

  <!-- ═══ Twitter / X Card ═══ -->
  <meta name="twitter:card" content="summary_large_image"/>

  <!-- Google Fonts: Fredoka (Headings), Plus Jakarta Sans (Body), Space Mono (Lab Code) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <script type="module">
    import { createShader } from 'https://esm.sh/shaders/js'

    const canvas = document.getElementById("canvas")

    const shader = await createShader(canvas, {
      components: [
        {
          type: 'Dither',
          id: 'idmkexsirpuqme310ag',
          props: {
            colorA: '#02171a',
            colorB: '#00CAC2',
            pattern: 'bayer8',
            pixelSize: 12,
            threshold: 0.4,
          },
          children: [
            {
              type: 'Plasma',
              id: 'idmmfg1q5n457lbjyqz',
              props: {
                colorA: '#ffffff',
                contrast: 0.9,
                density: 0.3,
                intensity: 1.3,
                speed: 1,
                stops: [{
                  color: '#ffffff',
                  position: 0
                }, {
                  color: '#000000',
                  position: 1
                }],
              },
            },
            {
              type: 'WaveDistortion',
              id: 'idmkexyi4bvi04l95hr',
              props: {
                angle: 117,
                edges: 'mirror',
                strength: 1,
                visible: true,
                waveType: 'square',
              },
            },
          ],
        },
        {
          type: 'GridDistortion',
          id: 'idmsgppwu73b2jcfeie',
          props: {
            gridSize: 8,
          },
        }
      ]
    })

    window.addEventListener('resize', () => {
      canvas.style = 'width: 100vw; height: 100dvh;'
      shader.resize()
    })
  </script>
</head>

<body>

    </section>
  </main>
